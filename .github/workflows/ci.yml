name: CI

on:
  pull_request:
  push:
    branches:
      - "master"
      - "maintenance/*"
    tags:
      - "[0-9].*"
  schedule:
    # Every Wednesday at 6:06 UTC
    - cron: "6 6 * * 3"

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pre-commit
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install tox
      - run: tox -e py

  msl-smoke:
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install tox
      - run: tox -e msl-smoke

  coverage:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags') }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install tox
      - run: tox -e coverage
      - uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags') }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  testpypi-deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ contains(github.ref_name, '.dev') }}
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pymoca
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '.dev') }}
    environment:
      name: pypi
      url: https://pypi.org/p/pymoca
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Auto-generated commit/PR list, appended to the summary below.
          generate_release_notes: true
          # Create as a draft, publish manually from GitHub UI
          draft: true
          body: |
            <!-- Summarize major user-facing changes and click Publish. -->
