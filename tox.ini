[tox]
envlist =
    py,coverage


[testenv]
passenv = GITHUB_ACTIONS
extras = all, test
# -n auto runs several tests per worker, surfacing shared-state/parallelism bugs.
commands = pytest -n auto test {posargs}


[testenv:msl-smoke]
passenv = GITHUB_ACTIONS
extras = all, test
# Fast subset of the MSL example models (msl_smoke marker) as a smoke check on
# MSL flattening. The full msl suite is too slow to run on every CI event.
commands = pytest -n auto -m msl_smoke test/msl_examples_test.py {posargs}


[testenv:rtc-tools-smoke]
passenv = GITHUB_ACTIONS
extras = all, test
# A 2-case subset of the RTC-Tools example suite (rtc_tools_smoke marker) as a smoke
# check. Installing `rtc-tools`/`rtc-tools-channel-flow` from PyPI first resolves their
# actual runtime deps (notably casadi's upper bound, which pymoca's own extras don't
# declare); pymoca, rtc-tools, and rtc-tools-channel-flow are then each re-pointed
# --no-deps at their local checkout (this repo, and the two submodules) so the suite
# runs pymoca dev against whatever commit the submodules track, independent of
# rtc-tools' pinned pymoca version. rtc-tools-standard-library is uninstalled again
# straight after: it registers its own bundled (MSL 3.x-era) "Modelica" library-folder
# entry point, which collides with the Deltares library folder's own extends resolution.
# No example .mo file imports it.
commands_pre =
    pip install rtc-tools rtc-tools-channel-flow
    pip uninstall -y rtc-tools-standard-library
    pip install --no-deps -e {toxinidir}
    pip install --no-deps -e {toxinidir}/test/libraries/rtc-tools-channel-flow
    pip install --no-deps -e {toxinidir}/test/libraries/rtc-tools
commands = pytest -n auto -m rtc_tools_smoke test/rtc_tools_test.py {posargs}


[testenv:coverage]
deps = pytest-cov
passenv = GITHUB_ACTIONS
extras = all, test
commands =
    pytest -n auto --cov --cov-report=xml test {posargs}
